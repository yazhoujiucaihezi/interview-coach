<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>面试陪练台 · 把材料丢进来，自动出题</title>
<meta name="description" content="上传面试记录、简历、README 或项目简介，自动识别类型、生成面试题，并可开口练习打分。">
<style>
  :root{
    --paper:#f5f4f0;
    --surface:#ffffff;
    --ink:#15181a;
    --ink2:#454c4f;
    --muted:#858c8f;
    --line:#e3e4de;
    --brand:#155e4c;
    --brand2:#1c7a62;
    --brand-soft:#e7f1ed;
    --amber:#a9660f;
    --amber-soft:#fbf3e6;
    --red:#ad3a30;
    --red-soft:#fbeeec;
    --green:#1f7a53;
    --green-soft:#e9f4ee;
    --rail:#121615;
    --rail2:#1b211f;
    --shadow:0 1px 2px rgba(21,24,26,.04),0 8px 24px -18px rgba(21,24,26,.25);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",system-ui,-apple-system,sans-serif;
    font-size:15px;line-height:1.72;letter-spacing:.005em;
  }
  button{font-family:inherit;cursor:pointer;}
  input,textarea,select{font-family:inherit;font-size:14px;color:var(--ink);}
  ::selection{background:#cfe6de;}

  /* ---------- layout ---------- */
  .app{display:flex;min-height:100vh;}
  .rail{
    width:218px;flex:0 0 218px;background:var(--rail);color:#c9d2cf;
    position:sticky;top:0;height:100vh;display:flex;flex-direction:column;
    padding:24px 16px 18px;
  }
  .brand{display:flex;align-items:center;gap:10px;padding:0 8px 22px;}
  .brand-mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(150deg,#1e7f66,#0f4538);display:grid;place-items:center;flex:0 0 30px;}
  .brand-mark span{color:#eaf6f1;font-size:13px;font-weight:700;letter-spacing:.02em;}
  .brand-txt b{display:block;color:#fff;font-size:14.5px;font-weight:600;letter-spacing:.02em;line-height:1.3;}
  .brand-txt small{display:block;color:#6f7d78;font-size:10.5px;letter-spacing:.12em;margin-top:2px;}
  nav{display:flex;flex-direction:column;gap:2px;margin-top:6px;}
  .navb{
    display:flex;align-items:center;gap:11px;background:none;border:0;color:#9aa7a2;
    padding:9px 12px;border-radius:8px;font-size:13.5px;text-align:left;transition:.16s;
  }
  .navb svg{width:16px;height:16px;flex:0 0 16px;opacity:.8;}
  .navb:hover{background:#1c2321;color:#e6eeeb;}
  .navb.on{background:var(--rail2);color:#fff;box-shadow:inset 2px 0 0 var(--brand2);}
  .navb.on svg{opacity:1;color:#4fbf9c;}
  .rail-foot{margin-top:auto;padding:14px 10px 0;border-top:1px solid #232b28;}
  .api-dot{display:flex;align-items:center;gap:8px;font-size:11.5px;color:#7d8a86;letter-spacing:.02em;}
  .dot{width:6px;height:6px;border-radius:50%;background:#5b6663;flex:0 0 6px;}
  .dot.live{background:#3fbf8f;box-shadow:0 0 0 3px rgba(63,191,143,.14);}

  main{flex:1;min-width:0;padding:0 0 80px;}
  .wrap{max-width:1060px;margin:0 auto;padding:30px 34px 0;}
  .topbar{display:flex;align-items:flex-end;gap:16px;margin-bottom:26px;flex-wrap:wrap;}
  .topbar h1{font-size:24px;margin:0;font-weight:700;letter-spacing:-.01em;}
  .topbar p{margin:0;color:var(--muted);font-size:13px;}
  .topbar .spacer{margin-left:auto;display:flex;gap:8px;align-items:center;}

  /* ---------- components ---------- */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);}
  .pad{padding:22px 24px;}
  .btn{
    border:1px solid transparent;border-radius:9px;padding:9px 16px;font-size:13.5px;font-weight:500;
    background:var(--brand);color:#fff;transition:.15s;display:inline-flex;align-items:center;gap:7px;
  }
  .btn:hover{background:var(--brand2);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn.ghost{background:transparent;color:var(--ink2);border-color:var(--line);}
  .btn.ghost:hover{background:#f2f2ee;color:var(--ink);}
  .btn.sm{padding:6px 12px;font-size:12.5px;border-radius:7px;}
  .btn.dark{background:#1a1f1e;}
  .btn.dark:hover{background:#2b3331;}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:3px 9px;border-radius:999px;background:#f0f0ec;color:var(--ink2);white-space:nowrap;}
  .muted{color:var(--muted);}
  .tiny{font-size:12px;}
  .row{display:flex;gap:10px;align-items:center;}
  .grow{flex:1;}

  /* dashboard */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px;}
  .stat{padding:18px 20px;}
  .stat b{display:block;font-size:27px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2;}
  .stat span{font-size:11.5px;color:var(--muted);letter-spacing:.06em;}
  .stat small{display:block;font-size:11.5px;color:var(--muted);margin-top:5px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  .h3{font-size:14px;font-weight:600;margin:0 0 14px;display:flex;align-items:center;gap:8px;}
  .h3 em{font-style:normal;font-weight:400;color:var(--muted);font-size:12px;}
  .barline{display:grid;grid-template-columns:78px 1fr 36px;align-items:center;gap:12px;margin-bottom:9px;font-size:12.5px;color:var(--ink2);}
  .track{height:6px;background:#eeeee9;border-radius:99px;overflow:hidden;display:block;}
  .fill{display:block;height:100%;border-radius:99px;background:var(--brand);transition:width .5s cubic-bezier(.2,.7,.2,1);}
  .num{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px;}

  .check-item{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed #ecedea;font-size:13.2px;color:var(--ink2);}
  .check-item:last-child{border-bottom:0;}
  .check-item input{appearance:none;width:16px;height:16px;border:1.4px solid #c8cbc4;border-radius:4px;flex:0 0 16px;margin:4px 0 0;cursor:pointer;position:relative;transition:.15s;}
  .check-item input:checked{background:var(--brand);border-color:var(--brand);}
  .check-item input:checked:after{content:"";position:absolute;left:4.5px;top:1px;width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(43deg);}
  .check-item input:checked + span{color:#9aa0a0;text-decoration:line-through;text-decoration-color:#cfd3cf;}

  /* bank */
  .filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px;}
  .fchip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-size:12.5px;color:var(--ink2);transition:.15s;}
  .fchip:hover{border-color:#c9cdc6;}
  .fchip.on{background:var(--ink);color:#fff;border-color:var(--ink);}
  .qgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .qcard{padding:18px 20px;display:flex;flex-direction:column;gap:10px;transition:.18s;border:1px solid var(--line);background:#fff;border-radius:13px;cursor:pointer;box-shadow:var(--shadow);}
  .qcard:hover{transform:translateY(-2px);border-color:#d3d6cf;}
  .qcard h4{margin:0;font-size:14px;font-weight:600;line-height:1.6;letter-spacing:-.005em;}
  .qcard .meta{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:6px;}
  .topic{font-size:11px;padding:2.5px 9px;border-radius:5px;font-weight:500;letter-spacing:.02em;}
  .best{margin-left:auto;font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted);}

  /* practice */
  .setup{max-width:760px;}
  .modegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 22px;}
  .modebox{border:1.4px solid var(--line);border-radius:11px;padding:15px 16px;background:#fff;text-align:left;transition:.15s;}
  .modebox:hover{border-color:#c9cdc6;}
  .modebox.on{border-color:var(--brand);background:var(--brand-soft);}
  .modebox b{display:block;font-size:13.5px;margin-bottom:3px;}
  .modebox span{font-size:11.5px;color:var(--muted);line-height:1.5;display:block;}

  .qhead{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .progress-txt{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;}
  .timer{margin-left:auto;font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--ink2);background:#fff;border:1px solid var(--line);padding:4px 11px;border-radius:7px;}
  .qbody{font-size:19px;line-height:1.72;font-weight:600;letter-spacing:-.01em;margin:0 0 8px;}
  .qintent{font-size:12.5px;color:var(--muted);margin:0 0 20px;}
  .answer-wrap{position:relative;}
  textarea#answer{
    width:100%;min-height:210px;border:1px solid var(--line);border-radius:12px;padding:16px 18px 46px;
    font-size:14.5px;line-height:1.85;resize:vertical;background:#fff;outline:none;transition:.15s;
  }
  textarea#answer:focus{border-color:#a9c9bd;box-shadow:0 0 0 3px rgba(28,122,98,.09);}
  .answer-tools{position:absolute;left:12px;bottom:10px;display:flex;gap:8px;align-items:center;}
  .mic{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;transition:.15s;}
  .mic:hover{background:#f4f4f0;}
  .mic.rec{background:var(--red);border-color:var(--red);}
  .mic.rec svg{color:#fff;}
  .mic svg{width:15px;height:15px;color:var(--ink2);}
  .counters{position:absolute;right:14px;bottom:12px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;}
  .hintline{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:9px;}

  .scoring{padding:44px 24px;text-align:center;}
  .pulse{width:44px;height:44px;border-radius:50%;border:2px solid var(--brand-soft);border-top-color:var(--brand);margin:0 auto 16px;animation:spin .9s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .steps{font-size:12.5px;color:var(--muted);margin-top:6px;min-height:20px;}

  /* result */
  .score-grid{display:grid;grid-template-columns:190px 1fr;gap:24px;align-items:start;}
  .ring-wrap{text-align:center;}
  .ring{position:relative;width:150px;height:150px;margin:0 auto;}
  .ring svg{transform:rotate(-90deg);}
  .ring .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .ring .val b{font-size:40px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.03em;}
  .ring .val span{font-size:10.5px;color:var(--muted);letter-spacing:.14em;margin-top:5px;}
  .verdict{font-size:14px;line-height:1.7;margin:0 0 14px;}
  .dim{margin-bottom:9px;}
  .dim .barline{grid-template-columns:64px 1fr 30px;margin-bottom:0;font-size:12px;}

  .block{margin-top:16px;padding:15px 17px;border-radius:10px;font-size:13.5px;line-height:1.8;}
  .block h5{margin:0 0 8px;font-size:11.5px;letter-spacing:.1em;color:var(--muted);font-weight:600;}
  .b-hit{background:var(--green-soft);}
  .b-miss{background:var(--amber-soft);}
  .b-err{background:var(--red-soft);}
  .err-item{padding:7px 0;border-bottom:1px dashed rgba(0,0,0,.07);}
  .err-item:last-child{border-bottom:0;padding-bottom:0;}
  .err-q{font-size:12.5px;color:#8a3a32;font-style:italic;}
  .err-fix{font-size:13px;margin-top:2px;}
  .b-ans{background:#f7f9f8;border:1px solid #e6ebe8;}
  .b-ans p{margin:0;font-size:14px;line-height:1.9;color:#2c3533;}
  .followup{margin-top:16px;border:1px solid #dfe7e3;background:linear-gradient(180deg,#fbfdfc,#f6faf8);border-radius:11px;padding:15px 17px;}
  .followup .q{font-size:14px;font-weight:600;margin:2px 0 6px;}
  .actions-row{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;}

  /* history */
  .hrow{display:grid;grid-template-columns:64px 1fr 96px 76px;gap:14px;align-items:center;padding:13px 18px;border-bottom:1px solid var(--line);font-size:13.2px;cursor:pointer;transition:.12s;}
  .hrow:hover{background:#fafaf7;}
  .hrow:last-child{border-bottom:0;}
  .hscore{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;}
  .hdetail{padding:0 18px 18px;background:#fcfcfa;border-bottom:1px solid var(--line);}

  /* settings */
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12.5px;color:var(--ink2);margin-bottom:6px;font-weight:500;}
  .field .desc{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.6;}
  .input{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 12px;outline:none;background:#fff;transition:.15s;}
  .input:focus{border-color:#a9c9bd;box-shadow:0 0 0 3px rgba(28,122,98,.08);}
  .presets{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px;}
  .warnbox{background:var(--amber-soft);border:1px solid #f0e0c4;border-radius:10px;padding:13px 16px;font-size:12.5px;color:#6b4a15;line-height:1.7;margin-bottom:16px;}

  .empty{text-align:center;padding:56px 20px;color:var(--muted);font-size:13.5px;}  .empty b{display:block;color:var(--ink2);font-size:15px;margin-bottom:6px;font-weight:600;}

  .tips4{display:grid;grid-template-columns:1fr 1fr;gap:7px 22px;font-size:12.8px;color:var(--ink2);line-height:1.75;}
  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:#151817;color:#fff;padding:10px 18px;border-radius:9px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:99;box-shadow:0 8px 30px -10px rgba(0,0,0,.5);}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .modal{position:fixed;inset:0;background:rgba(18,22,21,.45);display:grid;place-items:center;padding:20px;z-index:80;backdrop-filter:blur(2px);}
  .modal-inner{background:#fff;border-radius:16px;max-width:680px;width:100%;max-height:86vh;overflow:auto;padding:28px 30px;box-shadow:0 30px 80px -30px rgba(0,0,0,.5);}
  .modal-inner h2{font-size:19px;margin:0 0 6px;line-height:1.5;}
  .kv{margin-top:18px;}
  .kv h4{font-size:11.5px;letter-spacing:.1em;color:var(--muted);margin:0 0 6px;font-weight:600;}
  .kv p{margin:0;font-size:13.5px;color:var(--ink2);line-height:1.8;}
  .kv ul{margin:0;padding-left:17px;font-size:13.5px;color:var(--ink2);line-height:1.85;}
  details summary{cursor:pointer;font-size:12.5px;color:var(--brand);font-weight:500;list-style:none;outline:none;}
  details summary::-webkit-details-marker{display:none;}
  details summary:before{content:"▸ ";font-size:11px;}
  details[open] summary:before{content:"▾ ";}
  details .inner{margin-top:9px;padding:13px 15px;background:#f7f9f8;border-radius:9px;font-size:13.2px;line-height:1.85;color:#2f3836;}

  @media (max-width:900px){
    .stats{grid-template-columns:1fr 1fr;}
    .grid2{grid-template-columns:1fr;}
    .qgrid{grid-template-columns:1fr;}
    .score-grid{grid-template-columns:1fr;}
    .ring-wrap{display:flex;gap:20px;align-items:center;text-align:left;}
    .modegrid{grid-template-columns:1fr;}
    .tips4{grid-template-columns:1fr;}
  }
  @media (max-width:760px){
    .app{flex-direction:column;}
    .rail{width:auto;flex:none;height:auto;position:static;flex-direction:row;align-items:center;padding:10px 12px;gap:8px;overflow-x:auto;}
    .brand{padding:0 8px 0 0;flex:0 0 auto;}
    .brand-txt{display:none;}
    nav{flex-direction:row;margin:0;gap:1px;}
    .navb{padding:7px 8px;font-size:11.5px;gap:5px;white-space:nowrap;}
    .navb svg{width:13px;height:13px;flex:0 0 13px;}
    .navb span{display:inline;}
    .rail-foot{display:none;}
    .wrap{padding:20px 16px 0;}
    .topbar h1{font-size:20px;}
    .hrow{grid-template-columns:46px 1fr 60px;gap:10px;}
    .hrow .htime{display:none;}
  }
  /* ---------- 导入页 ---------- */
  .gh{display:flex;align-items:center;gap:8px;text-decoration:none;color:#8b9793;
      font-size:11.5px;padding:7px 9px;border-radius:8px;margin-bottom:12px;transition:.15s;}
  .gh:hover{color:#e6eeeb;background:#1c2321;}
  .gh svg{width:14px;height:14px;flex:0 0 14px;opacity:.85;}
  .gh span{font-variant-numeric:tabular-nums;letter-spacing:.02em;}
  .drop{border:1.6px dashed #cfd3cb;border-radius:14px;background:#fff;padding:34px 24px;
        text-align:center;transition:.18s;cursor:pointer;}
  .drop:hover,.drop.over{border-color:var(--brand);background:var(--brand-soft);}
  .drop svg{color:var(--brand);opacity:.9;}
  .drop b{display:block;font-size:15px;margin:11px 0 6px;}
  .drop span{font-size:12.5px;color:var(--muted);line-height:1.75;display:block;}
  .paste{width:100%;min-height:150px;border:1px solid var(--line);border-radius:11px;
         padding:14px 16px;font-size:13.5px;line-height:1.85;resize:vertical;outline:none;
         background:#fff;transition:.15s;}
  .paste:focus{border-color:#a9c9bd;box-shadow:0 0 0 3px rgba(28,122,98,.08);}

  /* ---------- 原声分段 ---------- */
  .seg{margin-bottom:10px;overflow:hidden;}
  .seg-h{display:flex;align-items:center;gap:11px;padding:14px 18px;cursor:pointer;flex-wrap:wrap;transition:.12s;}
  .seg-h:hover{background:#fafaf7;}
  .seg-h .tm{font-variant-numeric:tabular-nums;color:var(--muted);font-size:11.5px;flex:0 0 auto;}
  .seg-h h4{margin:0;font-size:13.8px;font-weight:600;flex:1;min-width:150px;letter-spacing:-.005em;}
  .seg-b{display:none;padding:0 18px 16px;}
  .seg.open .seg-b{display:block;}
  .turn{display:grid;grid-template-columns:38px 1fr;gap:11px;margin-bottom:8px;
        font-size:13.2px;line-height:1.82;}
  .turn .who{font-size:10.5px;color:var(--muted);padding-top:4px;letter-spacing:.08em;}
  .turn.q .txt{color:var(--ink);}
  .turn.a .txt{border-left:2px solid var(--line);padding-left:12px;color:var(--ink2);}

  /* ---------- 页脚 ---------- */
  .foot{margin-top:46px;padding:18px 0 46px;border-top:1px solid var(--line);
        font-size:12px;color:var(--muted);display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
  .foot a{display:inline-flex;align-items:center;gap:7px;color:var(--muted);
          text-decoration:none;transition:.15s;font-variant-numeric:tabular-nums;}
  .foot a:hover{color:var(--brand);}
  .foot .sep{opacity:.45;}

  @media(max-width:760px){
    .turn{grid-template-columns:30px 1fr;gap:8px;}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">
      <div class="brand-mark"><span>面</span></div>
      <div class="brand-txt"><b>面试陪练台</b><small>UPLOAD · PARSE · PRACTICE</small></div>
    </div>
    <nav id="nav"></nav>
    <div class="rail-foot">
      <a class="gh" href="https://github.com/yazhoujiucaihezi" target="_blank" rel="noopener" title="GitHub">
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.19 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
        <span>@yazhoujiucaihezi</span>
      </a>
      <div class="api-dot"><span class="dot" id="apiDot"></span><span id="apiTxt">未接入模型 · 本地粗评</span></div>
    </div>
  </aside>

  <main>
    <div class="wrap">
      <div class="topbar">
        <div>
          <h1 id="pageTitle">导入</h1>
          <p id="pageSub">把面试记录丢进来，自动切段、识别问答、生成题库。</p>

<script>
/* =========================================================
   基础
   ========================================================= */
const LS = {
  get(k,d){ try{ const v=localStorage.getItem("mt."+k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem("mt."+k, JSON.stringify(v)); }catch(e){} }
};

const state = {
  view:"import",
  doc:null,
  questions:[],
  records: LS.get("records", []),
  settings: LS.get("settings", {base:"",key:"",model:"",temp:0.3}),
  bankFilter:"all",
  ai:{status:"idle",error:"",summary:"",advice:[]},
  practice:null,
  tab:"",
  segOpen:{},
  toastTimer:null
};

const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nl2br = s => esc(s).replace(/\n/g,"<br>");
const avg = a => a.length ? Math.round(a.reduce((x,y)=>x+y,0)/a.length) : 0;
const scoreColor = s => s>=80 ? "var(--green)" : s>=60 ? "var(--amber)" : "var(--red)";
const qById = id => state.questions.find(q=>q.id===id);

function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(state.toastTimer);
  state.toastTimer=setTimeout(()=>t.classList.remove("show"),2400);
}
function save(){
  LS.set("settings", state.settings);
  LS.set("records", state.records);
  updateApiStatus();
}
function updateApiStatus(){
  const s=state.settings;
  const on=!!(s.base&&s.key&&s.model);
  $("#apiDot").className="dot"+(on?" live":"");
  $("#apiTxt").textContent=on?("已接入 · "+s.model):"未接入模型 · 本地粗评";
}

function countFillers(t){
  const map={"就是":0,"然后":0,"那个":0,"应该":0,"这个":0,"反正":0,"大概":0,"差不多":0,"呃":0,"嗯":0};
  Object.keys(map).forEach(w=>{ map[w]=(t.split(w).length-1); });
  return {map, total:Object.values(map).reduce((a,b)=>a+b,0)};
}
function fmtDur(s){
  if(s===0) return "1 秒内";
  if(!s) return "—";
  return s<60 ? s+" 秒" : Math.floor(s/60)+" 分 "+(s%60)+" 秒";
}
function timeAgo(ts){
  const d=Math.floor((Date.now()-ts)/1000);
  if(d<60) return "刚刚";
  if(d<3600) return Math.floor(d/60)+" 分钟前";
  if(d<86400) return Math.floor(d/3600)+" 小时前";
  if(d<86400*7) return Math.floor(d/86400)+" 天前";
  return new Date(ts).toLocaleDateString("zh-CN",{month:"numeric",day:"numeric"});
}

/* =========================================================
   材料类型与出题
   ========================================================= */
const LEVEL_META={basic:{t:"基础",c:"#586064",bg:"#eef0f0"},deep:{t:"深挖",c:"#2f6fb0",bg:"#eaf1f9"},edge:{t:"边界",c:"#a9660f",bg:"#fbf3e6"}};
const TYPE_NAMES = {dialogue:"面试记录", resume:"简历", readme:"README / 项目", doc:"通用材料"};
const TECH = ["Java","Spring Boot","Spring Cloud","Spring MVC","Spring","MyBatis","MyBatis-Plus","MySQL","PostgreSQL",
  "Redis","RabbitMQ","Kafka","RocketMQ","Nacos","Gateway","Sentinel","OpenFeign","Redisson","Elasticsearch",
  "MongoDB","Nginx","Netty","Docker","Kubernetes","K8s","Jenkins","Vue","React","TypeScript","JavaScript",
  "JWT","Shiro","Seata","XXL-Job","Canal","Prometheus","Grafana","SkyWalking","Linux","Git","Maven","Gradle"];

function normalizeBase(input){
  let s=String(input||"").trim().replace(/\s+/g,"");
  if(!s) return "";
  if(!/^https?:\/\//i.test(s)) s="https://"+s;          // 少了协议头
  s=s.replace(/\/+$/,"");                                  // 去掉尾部斜杠
  s=s.replace(/\/chat\/completions$/i,"");                 // 误把完整路径填进来
  s=s.replace(/\/completions$/i,"");
  return s;
}

const stripMd = s => String(s||"").replace(/\*\*/g,"").replace(/`/g,"").replace(/^[-*>\s]+/,"").trim();
const brief = (s,n) => {
  let t = stripMd(s).replace(/[（(][^）)]{0,20}[）)]/g,"").replace(/\s*[|｜].*$/,"")
    .replace(/\s*\d{4}[.\-/]\d{1,2}.*$/,"").replace(/\s{2,}/g," ").trim();
  t = t.split(/[。；;，,]/)[0].trim();
  return t.length>n ? t.slice(0,n)+"…" : t;
};
const entryish = s => {
  const t = stripMd(s);
  return t.length>=4 && t.length<=42 && !/^(完成|实现|负责|使用|通过|基于|采用|参与|包含|主要|支持|同时)/.test(t);
};
function splitSkills(line){
  const out=[];
  const parts=stripMd(line).split(/[:：]/);
  const head=parts[0].trim();
  if(head && head.length<=16 && !/[，,、。]/.test(head)) out.push(head);
  (parts[1]||"").split(/[、，,；;]/)
    .map(x=>x.trim().replace(/^(熟悉|掌握|了解|熟练|使用过|用过|精通)/,"").trim())
    .filter(x=>x.length>=2&&x.length<=18)
    .forEach(x=>out.push(x));
  return [...new Set(out)].filter(Boolean);
}
let _qid=0;
function qNew(title,intent,extra){
  _qid++;
  return Object.assign({id:"g"+Date.now().toString(36)+_qid, seg:0, title, intent, ref:"", src:"",
    followups:[], rubric:[], pitfalls:[], hint:"", follow:false}, extra||{});
}
function dedupe(qs){
  const seen=new Set(), out=[];
  qs.forEach(q=>{ const k=q.title.replace(/\s/g,""); if(seen.has(k)) return; seen.add(k); out.push(q); });
  return out;
}

function detectType(doc,name){
  const qn=doc.segs.reduce((a,s)=>a+s.turns.filter(t=>t.w==="Q").length,0);
  if(qn>=3) return "dialogue";
  const head=doc.segs.map(s=>s.title).join(" ");
  const raw=doc.raw;
  if(/个人简历|求职简历|简历|教育经历|教育背景|工作经历|项目经历|项目经验|实习经历|专业技能|技术栈|个人优势|求职意向|自我评价|获奖情况|个人信息|联系方式|校园经历/.test(head+" "+raw.slice(0,1200))) return "resume";
  if(/README|项目简介|项目介绍|安装|快速开始|使用说明|Getting Started|Usage|Features|技术栈|项目结构/i.test(head+" "+name) || /```/.test(raw)) return "readme";
  return "doc";
}

/* 简历 → 预测面试题 */
function scanProjects(doc){
  const lines=doc.raw.split("\n");
  let inProj=false, secLv=9, cur=null;
  const out=[];
  const SEC=/^(#{1,6})\s+(.*)$/;
  for(const raw of lines){
    const t=raw.trim(); if(!t) continue;
    const h=t.match(SEC);
    if(h){
      const lv=h[1].length, title=h[2].trim();
      if(/项目|作品|实践/.test(title)){ inProj=true; secLv=lv; cur=null; continue; }
      if(inProj && lv<=secLv){ inProj=false; cur=null; continue; }
      if(inProj){
        const nm=brief(title,26);
        if(nm&&nm.length>=3){ cur={name:nm,src:title}; out.push(cur); }
      }
      continue;
    }
    if(!inProj) continue;
    const b=t.replace(/^[-*]\s*/,"").replace(/\*\*/g,"").trim();
    if(!b) continue;
    if(!cur && entryish(b)){
      const nm=brief(b,26);
      if(nm&&nm.length>=3){ cur={name:nm,src:b}; out.push(cur); }
    }
  }
  return out;
}

const SKILL_STOP=/^(框架|数据库|缓存|工具|中间件|消息队列|语言|基础|其他|编程|开发|版本控制|容器|前端|后端|运维|存储|服务|组件|技能|技术)$/;

function buildResumeQuestions(doc){
  const qs=[];
  qs.push(qNew("用 1 分钟做个自我介绍。","简历 · 开场"));
  qs.push(qNew("简历上的项目，哪个更难？为什么？","简历 · 开场"));

  scanProjects(doc).slice(0,4).forEach(p=>{
    qs.push(qNew(`「${p.name}」这个项目，你负责哪一部分？整体怎么设计的？`,"简历 · 项目",{src:p.src}));
    qs.push(qNew(`「${p.name}」里最难的一个点是什么？怎么解决的？`,"简历 · 项目",{src:p.src}));
  });

  ((doc.facts&&doc.facts.metrics)||[]).slice(0,5).forEach(m=>{
    qs.push(qNew(`简历上写「${m}」，这个数字是怎么测出来的？口径说清楚。`,"简历 · 数字"));
  });

  let sk=0;
  doc.segs.forEach((s,si)=>{
    if(!/技能|技术栈|掌握|熟悉|专长/.test(s.title)) return;
    s.turns.forEach(t=>{
      splitSkills(t.s).forEach(x=>{
        if(sk>=8||SKILL_STOP.test(x)) return;
        qs.push(qNew(`你说熟悉「${x}」，讲讲它的原理，以及你项目里哪里用到了？`,"简历 · "+s.title,{seg:si,src:stripMd(t.s).slice(0,120)}));
        sk++;
      });
    });
  });

  doc.segs.forEach((s,si)=>{
    if(/教育|学校|在读/.test(s.title)) qs.push(qNew("现在几年级？能实习多久，每周几天？","简历 · 基本情况",{seg:si}));
    if(/实习|工作/.test(s.title)) qs.push(qNew("这段实习你具体做了什么？为什么离开？","简历 · 经历",{seg:si}));
  });

  return dedupe(qs).slice(0,28);
}

function buildReadmeQuestions(doc){
  const qs=[];
  qs.push(qNew("这个项目解决什么问题？一句话说清楚。","项目 · 开场"));
  qs.push(qNew("整体架构是怎样的？请求从进入到返回经过哪些模块？","项目 · 架构"));

  const SKIP=/安装|部署|使用|快速开始|Getting|Usage|License|许可|目录|结构|环境|配置|运行|技术栈|技术选型|依赖|贡献|致谢|FAQ|更新|版本|Roadmap/i;
  doc.segs.forEach((s,si)=>{
    if(s.lv===1) return;
    if(SKIP.test(s.title)) return;
    if(/项目简介|项目介绍|简介|概述|背景/i.test(s.title)) return;
    if(!s.title||s.title.length>26) return;
    qs.push(qNew(`「${s.title}」这块是怎么实现的？`,"项目 · "+s.title,{seg:si}));
  });

  ((doc.facts&&doc.facts.techs)||[]).slice(0,6).forEach(t=>{
    qs.push(qNew(`为什么用 ${t}？有没有考虑过别的方案？`,"项目 · 技术选型"));
  });

  qs.push(qNew("这个项目最难的地方在哪？你踩过什么坑？","项目 · 深挖"));
  qs.push(qNew("如果流量涨 10 倍，你会先改哪里？瓶颈在哪？","项目 · 扩展性"));
  qs.push(qNew("这个项目有哪些地方是没做完的？","项目 · 边界"));

  return dedupe(qs).slice(0,22);
}

/* 通用材料 → 讲解题 */
function buildDocQuestions(doc){
  const qs=[];
  doc.segs.forEach((s,si)=>{
    if(s.title==="正文") return;
    qs.push(qNew(`用 1 分钟讲清楚「${s.title}」。`,"材料 · "+s.title,{seg:si,
      src:stripMd((s.turns[0]||{}).s||"").slice(0,120)}));
  });
  if(!qs.length) qs.push(qNew("用 1 分钟讲清楚这份材料的核心内容。","材料"));
  return dedupe(qs).slice(0,16);
}

function buildQuestions(doc){
  if(doc.type==="resume") return buildResumeQuestions(doc);
  if(doc.type==="readme") return buildReadmeQuestions(doc);
  if(doc.type==="doc") return buildDocQuestions(doc);
  return buildDialogueQuestions(doc);
}


const TIME_RE = /(\d{1,2}:\d{2}(?::\d{2})?)/;
const Q_WORD = /面试|官|提问|interviewer|^q$|问/i;
const A_WORD = /候选|应聘|本人|我|答|candidate|^a$/i;

function parseMarkdown(raw, name){
  const text = String(raw).replace(/^\uFEFF/,"").replace(/\r\n?/g,"\n");
  const lines = text.split("\n");

  // ① 先统计粗体标签，猜出说话人
  const cnt={};
  lines.forEach(l=>{
    const m=l.match(/^\s*(?:[-*>]\s*)?\*\*([^*\n]{1,14})\*\*\s*[:：]/);
    if(m){ const k=m[1].trim(); cnt[k]=(cnt[k]||0)+1; }
  });
  const names=Object.keys(cnt).filter(k=>cnt[k]>=2 && k.length<=12).sort((a,b)=>cnt[b]-cnt[a]);
  const qNames=new Set(names.filter(n=>Q_WORD.test(n) && !A_WORD.test(n)));
  const aNames=new Set(names.filter(n=>!qNames.has(n)).slice(0,3));

  const speakerOf=n=>{
    if(qNames.has(n)) return "Q";
    if(aNames.has(n)) return "A";
    if(/^面试官$|^面试$|^提问$|^interviewer$/i.test(n)) return "Q";
    if(/^我$|^本人$|^候选人$|^应聘者$|^答$|^candidate$/i.test(n)) return "A";
    return null;
  };

  // ② 按标题切段
  const segs=[];
  let cur=null, last=null;
  const newSeg=(title,tm,lv)=>{ cur={title:title||"正文",tm:tm||"",lv:lv||2,turns:[]}; segs.push(cur); last=null; };
  const addTurn=(w,txt)=>{
    if(!cur) newSeg("正文","");
    const s=String(txt||"").trim();
    if(!s) return;
    cur.turns.push({w,s});
    last=cur.turns[cur.turns.length-1];
  };

  for(const rawLine of lines){
    const t=rawLine.trim();
    if(!t){ last=null; continue; }
    if(/^```/.test(t)) continue;

    const h=t.match(/^(#{1,6})\s+(.*)$/);
    if(h){
      const tm=(h[2].match(TIME_RE)||[])[1]||"";
      let title=h[2].replace(TIME_RE,"").replace(/[｜|]/g," ").replace(/^\s*\d+[.、]\s*/,"").replace(/\s+/g," ").trim();
      newSeg(title,tm,h[1].length);
      continue;
    }
    if(/^[-*_]{3,}$/.test(t)) continue;
    if(/^\|/.test(t)) continue;
    if(/^>/.test(t) && !/^>\s*[^:：]{1,16}[:：]/.test(t)) continue;

    let m=t.match(/^\s*(?:[-*]\s*)?\*\*([^*\n]{1,14})\*\*\s*[:：]\s*(.*)$/);
    if(m){
      const w=speakerOf(m[1].trim());
      if(w){ addTurn(w,m[2]); continue; }
      continue;
    }
    m=t.match(/^\s*(?:Q|问)\s*[:：]\s*(.+)$/i);
    if(m){ addTurn("Q",m[1]); continue; }
    m=t.match(/^\s*(?:A|答)\s*[:：]\s*(.+)$/i);
    if(m){ addTurn("A",m[1]); continue; }
    m=t.match(/^>\s*([^:：]{1,16})[:：]\s*(.+)$/);
    if(m){
      const w=speakerOf(m[1].trim());
      if(w){ addTurn(w,m[2]); continue; }
    }

    if(last){
      last.s = last.s.replace(/\s*$/,"") + " " + t.replace(/^[-*]\s*/,"");
    }
  }

  let clean = segs.filter(s=>s.turns.length);

  // ③ 没有识别出问答：退回「按段落的纯文模式」
  if(!clean.length){
    const parts=[]; let c=null;
    for(const rawLine of lines){
      const t=rawLine.trim();
      if(!t) continue;
      const h=t.match(/^(#{1,6})\s+(.*)$/);
      if(h){ c={title:h[2].replace(/^\s*\d+[.、]\s*/,"").trim(),lv:h[1].length,tm:(h[2].match(TIME_RE)||[])[1]||"",turns:[]}; parts.push(c); continue; }
      if(/^\|/.test(t)||/^[-*_]{3,}$/.test(t)) continue;
      if(!c){ c={title:"正文",tm:"",turns:[]}; parts.push(c); }
      c.turns.push({w:"P", s:t.replace(/^[-*]\s*/,"").replace(/\*\*/g,"")});
    }
    clean=parts.filter(p=>p.turns.length);
  }

  return {
    name: name || "未命名记录",
    raw: text,
    at: Date.now(),
    chars: text.replace(/\s/g,"").length,
    segs: clean
  };
}

function buildDialogueQuestions(doc){
  const qs=[];
  doc.segs.forEach((seg,si)=>{
    let lastQ=null, prevW=null;
    seg.turns.forEach((t,ti)=>{
      if(t.w==="Q"){
        const prevLen = lastQ ? lastQ.ref.replace(/\s/g,"").length : 0;
        const isFollow = prevW==="Q" || (!!lastQ && prevLen<35);
        const q={
          id:"q"+si+"_"+ti, seg:si, title:t.s,
          intent:"来自「"+seg.title+"」"+(seg.tm?" · "+seg.tm:""),
          ref:"", followups:[], rubric:[], pitfalls:[], hint:"", follow:isFollow
        };
        if(isFollow && lastQ){ lastQ.followups.push(q.title); }
        qs.push(q); lastQ=q; prevW="Q";
      }else if(t.w==="A"){
        if(lastQ){
          lastQ.ref = lastQ.ref ? lastQ.ref+"\n"+t.s : t.s;
        }
        prevW="A";
      }else{ prevW="P"; }
    });
  });
  return qs;
}

function buildStats(doc, qs){
  const lens=qs.filter(q=>q.ref).map(q=>q.ref.replace(/\s/g,"").length);
  const fill=countFillers(doc.raw);
  const short=qs.filter(q=>q.ref && q.ref.replace(/\s/g,"").length<20).length;
  const follows=qs.filter(q=>q.follow).length;
  let maxChain=0,c=0;
  qs.forEach(q=>{ if(q.follow){ c++; } else { c=1; } maxChain=Math.max(maxChain,c); });
  return {
    segs: doc.segs.length,
    qs: qs.length,
    answered: qs.filter(q=>q.ref).length,
    avgLen: lens.length?avg(lens):0,
    fill: fill.total,
    fillMap: fill.map,
    short,
    follows,
    maxChain
  };
}

function docFacts(doc){
  const text=doc.raw;
  const bullets=doc.segs.reduce((a,s)=>a+s.turns.filter(t=>t.w==="P"||t.w==="A").length,0);
  const codeBlocks=Math.floor(((text.match(/```/g)||[]).length)/2);
  const metricRe=/(\d+(?:\.\d+)?)\s*(?:QPS|qps|TPS|ms|毫秒|万|亿|个服务|个微服务|张表|个接口|条)/g;
  const metrics=[...new Set((text.match(metricRe)||[]).map(x=>x.trim()))].slice(0,8);
  const lower=text.toLowerCase();
  const hitT=TECH.filter(t=>lower.includes(t.toLowerCase()));
  const techs=hitT.filter(t=>!hitT.some(o=>o!==t && o.length>t.length && o.toLowerCase().startsWith(t.toLowerCase()+" "))).slice(0,12);
  return {bullets, codeBlocks, metrics, techs, headings:doc.segs.map(s=>s.title), chars:doc.chars};
}

/* =========================================================
   载入
   ========================================================= */
function applyDoc(raw, name){
  const doc=parseMarkdown(raw,name);
  if(!doc.segs.length){ toast("没识别到内容，检查一下文件格式"); return false; }
  doc.type=detectType(doc,name);
  doc.facts=docFacts(doc);
  const statQ = doc.type==="dialogue" ? buildDialogueQuestions(doc) : [];
  doc.stats=buildStats(doc,statQ);
  state.doc=doc;
  state.questions=[];                       // 模板题已停用，改为模型按内容生成
  state.ai={status:"idle",error:"",summary:"",advice:[]};
  state.practice=null; state.bankFilter="all"; state.segOpen={};
  LS.set("doc",{name:doc.name, raw:doc.raw, type:doc.type, at:doc.at});
  return true;
}

function loadText(raw,name,silent){
  const ok=applyDoc(raw,name);
  if(!ok) return;
  if(!silent) toast(`已解析 ${state.doc.segs.length} 段`);
  state.view = "overview";
  if(restoreAI()){ render(); return; }
  if(aiReady()){ generateWithAI(); return; }
  render();
}

function readFile(file){
  if(!file) return;
  if(file.size > 3*1024*1024){ toast("文件超过 3MB，先精简一下"); return; }
  const r=new FileReader();
  r.onload=()=>loadText(String(r.result||""), file.name);
  r.onerror=()=>toast("读取失败，换个文件试试");
  r.readAsText(file,"utf-8");
}

/* =========================================================
   AI 出题（按材料内容生成，不是模板）
   ========================================================= */
function aiReady(){ const s=state.settings; return !!(s.base&&s.key&&s.model); }
const docKey = d => d ? (d.raw.length+":"+d.raw.slice(0,80)) : "";

function buildGenPrompt(doc,count){
  const n=count||12;
  const raw=doc.raw;
  const excerpt = raw.length>6800 ? raw.slice(0,4600)+"\n\n……（中间省略）……\n\n"+raw.slice(-1900) : raw;
  const hint = {dialogue:"这是一份真实的面试记录", resume:"这是一份简历",
    readme:"这是一个项目的 README", doc:"这是一份技术学习材料"}[doc.type] || "这是一份技术材料";
  return [
    {role:"system", content:`你是资深 Java 后端面试官，正在为候选人准备下一场面试。${hint}。

出题铁律：
1. 每一道题都必须锚定材料里真实出现的东西——具体技术名、模块名、数字、或某句原话。绝对禁止「自我介绍」「你最大的优点」「哪个项目更难」「项目你负责哪部分」这类通用题。
2. 题面必须具体到能直接开口答。反例：「讲讲你的项目」。正例：「你说热榜用 ZSet 存 postId→分数，7 天以外的成员怎么清理，为什么不用定时扫表」。
3. 三档分布：basic 核对事实、deep 问实现与取舍、edge 问边界与故障。deep + edge 至少占三分之二。
4. points 给 2-3 条答题要点，每条不超过 20 字，是要能直接说出口的关键词句，不要写「要全面」「要深入」这种空话。
5. quote 必须是材料原文里的片段，不超过 40 字，用来定位这道题从哪来。
6. 不要编造材料里没有的技术。材料没写清楚的，就出成「这块你打算怎么补」这类。

输出必须是单行合法的 JSON：不要 markdown 代码块，不要注释，不要在字符串里换行，字段之间不要有多余文字。内容写简短，宁可少写也不要超长。`},
    {role:"user", content:`【材料】
"""
${excerpt}
"""

输出：
{
  "summary": "一句话说这份材料的水平和最该补的地方，45 字内",
  "advice": ["3-5 条针对这份材料的具体建议，每条 25 字内，必须引用材料里的具体内容"],
  "questions": [
    {"q": "题面", "why": "面试官问这个想考察什么，20 字内", "points": ["要点1","要点2","要点3"], "quote": "原文片段", "level": "basic|deep|edge"}
  ]
}
出 ${n} 道题，覆盖材料里不同的技术点，不要反复问同一个模块。`}
  ];
}

function saveAI(){
  if(!state.doc) return;
  LS.set("ai",{
    key: docKey(state.doc),
    summary: state.ai.summary,
    advice: state.ai.advice,
    questions: state.questions.map(q=>({id:q.id,title:q.title,intent:q.intent,
      points:q.points||[],src:q.src||"",level:q.level||"deep",ref:q.ref||"",followups:q.followups||[]}))
  });
}

function restoreAI(){
  const sv=LS.get("ai",null);
  if(!sv||!state.doc||sv.key!==docKey(state.doc)) return false;
  if(!Array.isArray(sv.questions)||!sv.questions.length) return false;
  state.questions=sv.questions.map(q=>Object.assign({rubric:[],pitfalls:[],hint:"",follow:false,ai:true},q));
  state.ai={status:"done",error:"",summary:sv.summary||"",advice:sv.advice||[]};
  return true;
}

async function generateWithAI(){
  if(!state.doc) return;
  if(!aiReady()){ toast("先在设置里接入模型，才能按内容出题"); state.view="settings"; render(); return; }

  state.ai={status:"loading",error:"",summary:"",advice:[],note:""};
  state.view="overview"; state.practice=null;
  render();

  const toQs = list => list
    .filter(x=>x&&typeof x==="object")
    .map((x,i)=>({
      id:"ai"+i+"_"+Date.now().toString(36),
      title:String(x.q||x.question||"").trim(),
      intent:String(x.why||x.intent||"AI 生成"),
      points:(Array.isArray(x.points)?x.points:[]).map(String).filter(Boolean).slice(0,5),
      src:String(x.quote||x.src||""),
      ref:"",
      level:["basic","deep","edge"].indexOf(x.level)>=0?x.level:"deep",
      followups:[], rubric:[], pitfalls:[], hint:"", follow:false, ai:true
    }))
    .filter(q=>q.title.length>=6);

  try{
    // 第一轮：12 题、4000 token，给足输出空间
    let text=await callModel(buildGenPrompt(state.doc,12),{temp:0.4,maxTokens:4000,raw:true});
    let data=null, salvaged=0;

    try{ data=parseJSON(text); }
    catch(e){
      const part=salvageQuestions(text);
      if(part){
        data={questions:part, summary:salvageField(text,"summary"), advice:[]};
        salvaged=part.length;
      }
    }

    // 第一轮彻底没救（比如输出被砍在第一个题里）：自动重试一次，只要 8 题
    if(!data){
      text=await callModel(buildGenPrompt(state.doc,8),{temp:0.3,maxTokens:4000,raw:true});
      try{ data=parseJSON(text); }
      catch(e2){
        const part=salvageQuestions(text);
        if(part){ data={questions:part,summary:salvageField(text,"summary"),advice:[]}; salvaged=part.length; }
      }
    }

    if(!data) throw new Error("模型两次都没能给出可解析的 JSON。建议换 deepseek-chat 或 glm-4-flash 再试。");

    if(Array.isArray(data)) data={questions:data};
    const qs=toQs(Array.isArray(data.questions)?data.questions:[]);
    if(qs.length<3) throw new Error("模型只返回了 "+qs.length+" 道有效题目，可能是输出被截断。再点一次「重新生成」即可。");

    state.questions=qs;
    state.ai={
      status:"done", error:"",
      summary:String(data.summary||""),
      advice:(Array.isArray(data.advice)?data.advice:[]).map(String).filter(Boolean).slice(0,6),
      note: salvaged
        ? (truncated(text) ? "输出被截断，已保留完整的 "+qs.length+" 道"
                           : "输出格式不规范，已提取 "+qs.length+" 道")
        : ""
    };
    saveAI();
    toast(salvaged ? "输出被截断，已保留 "+qs.length+" 道题" : "已按材料生成 "+qs.length+" 道题");
  }catch(e){
    state.ai={status:"error",error:e.message||"出题失败",summary:"",advice:[],note:""};
    toast(e.message||"出题失败");
  }
  render();
}

function exportQuestions(){
  if(!state.questions.length){ toast("还没有题目"); return; }
  const L=["# 面试题单","",`来源：${state.doc?state.doc.name:"—"} · 共 ${state.questions.length} 题 · ${new Date().toLocaleString("zh-CN")}`,""];
  if(state.ai.summary) L.push("> "+state.ai.summary,"");
  if(state.ai.advice.length){ L.push("**建议**",""); state.ai.advice.forEach(a=>L.push("- "+a)); L.push(""); }
  state.questions.forEach((q,i)=>{
    L.push(`## ${i+1}. ${q.title}`);
    L.push(`*${q.level||"deep"} · ${q.intent}*`);
    if(q.src) L.push("","**原文**："+q.src);
    if(q.points&&q.points.length){ L.push("","**答题要点**"); q.points.forEach(p=>L.push("- "+p)); }
    L.push("");
  });
  download("面试题单.md",L.join("\n"),"text/markdown");
}

      <div class="card stat"><span>生成题目</span><b>${qs.length}</b><small>${TYPE_NAMES[d.type]}模式</small></div>
      <div class="card stat"><span>${d.type==="readme"?"技术关键词":"可问条目"}</span><b>${d.type==="readme"?(f.techs||[]).length:(f.bullets||0)}</b><small>${d.type==="readme"?((f.techs||[]).slice(0,2).join(" / ")||"—"):"列表项 / 段落"}</small></div>
      <div class="card stat"><span>数字指标</span><b>${(f.metrics||[]).length}</b><small>${(f.metrics||[]).slice(0,2).join(" · ")||"没抽到"}</small></div>

  const aiCard = (()=>{
    const a=state.ai;
    if(a.status==="loading") return `<div class="card pad" style="margin-bottom:16px">
      <div class="row" style="gap:12px">
        <div class="pulse" style="width:22px;height:22px;margin:0;border-width:2px"></div>

        <div class="tiny muted">按材料里的具体技术点出 · 约 10–40 秒 · 输出较长时较慢</div></div>
      </div></div>`;
    if(a.status==="error") return `<div class="card pad" style="margin-bottom:16px;border-left:3px solid var(--red)">
      <b style="font-size:13.5px">出题失败</b>
      <p class="tiny" style="margin:6px 0 10px;color:var(--red);line-height:1.7">${esc(a.error)}</p>
      <button class="btn sm" data-gen="1">重试</button></div>`;
    if(a.status==="done") return `<div class="card pad" style="margin-bottom:16px;border-left:3px solid var(--green)">
      <div class="row" style="flex-wrap:wrap;gap:9px">
        <b style="font-size:13.5px">已按材料生成 ${qs.length} 道题</b>
        <span class="tiny muted">${esc(a.note||"basic / deep / edge 三档")}</span>
        <span class="grow"></span>
        <button class="btn sm ghost" data-gen="1">重新生成</button>
        <button class="btn sm ghost" id="expq">导出题单</button>
      </div>
      ${a.summary?`<p class="tiny" style="margin:9px 0 0;color:var(--ink2);line-height:1.75">${esc(a.summary)}</p>`:""}
      ${a.advice.length?`<ul class="tiny" style="margin:8px 0 0;padding-left:17px;color:var(--ink2);line-height:1.85">
        ${a.advice.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}
    </div>`;
    return `<div class="card pad" style="margin-bottom:16px;border-left:3px solid var(--amber)">
      <b style="font-size:13.5px">材料已解析，还没有出题</b>
      <p class="tiny" style="margin:6px 0 10px;color:var(--ink2);line-height:1.75">出题由模型完成：它读这份材料，按里面出现的具体技术点、模块、数字出题。<b>没有接入模型时不会生成题目</b>，避免给你一堆通用题。</p>
      <div class="row" style="gap:7px"><button class="btn sm" data-nav="settings">去接入模型</button>
      <button class="btn sm ghost" data-gen="1">已接入，现在生成</button></div>
    </div>`;
  })();

  const middle = isDlg ? `
    <div class="grid2" style="margin-bottom:18px">
      <div class="card pad">
        <h3 class="h3">这场面试的形状</h3>
        <div class="barline"><span>提问</span><span class="track"><span class="fill" style="width:100%"></span></span><span class="num">${st.qs}</span></div>
        <div class="barline"><span>有回答</span><span class="track"><span class="fill" style="width:${st.qs?Math.round(st.answered/st.qs*100):0}%;background:var(--green)"></span></span><span class="num">${st.answered}</span></div>
        <div class="barline"><span>追问链</span><span class="track"><span class="fill" style="width:${st.qs?Math.round(st.follows/st.qs*100):0}%;background:var(--amber)"></span></span><span class="num">${st.follows}</span></div>
        <div class="barline"><span>短回答</span><span class="track"><span class="fill" style="width:${st.qs?Math.round(st.short/st.qs*100):0}%;background:var(--red)"></span></span><span class="num">${st.short}</span></div>
        <p class="tiny muted" style="margin:14px 0 0;line-height:1.75">最长一串追问 <b>${st.maxChain}</b> 轮。追问越多，通常说明前一个回答没让面试官满意。</p>
      </div>
      <div class="card pad">
        <h3 class="h3">表达诊断 <em>口头禅出现次数</em></h3>
        ${fillTop.length?fillTop.map(([k,v])=>`
          <div class="barline"><span>「${k}」</span>
            <span class="track"><span class="fill" style="width:${Math.min(100,v/(fillTop[0][1]||1)*100)}%;background:var(--amber)"></span></span>
            <span class="num">${v}</span>
          </div>`).join(""):`<p class="tiny muted" style="margin:0">这段里没有检测到明显的口头禅。</p>`}
        <p class="tiny muted" style="margin:14px 0 0;line-height:1.75">「就是」「然后」出现在句首时，通常意味着你在边想边说，没有先给结论。</p>
      </div>
    </div>` : `
    <div class="grid2" style="margin-bottom:18px">
      <div class="card pad">
        <h3 class="h3">最容易被追问的地方</h3>
        ${(f.metrics&&f.metrics.length)?`<p class="tiny" style="margin:0 0 6px;color:var(--ink2)">数字 / 指标</p>
          ${f.metrics.slice(0,5).map(m=>`<div class="check-item" style="padding:6px 0"><span>「${esc(m)}」—— 怎么测的？口径是什么？</span></div>`).join("")}`:""}
        ${(f.techs&&f.techs.length)?`<p class="tiny" style="margin:14px 0 6px;color:var(--ink2)">技术选型</p>
          <div style="display:flex;flex-wrap:wrap;gap:6px">${f.techs.slice(0,10).map(t=>`<span class="chip">${esc(t)}</span>`).join("")}</div>`:""}
        ${(!f.metrics||!f.metrics.length)&&(!f.techs||!f.techs.length)?`<p class="tiny muted" style="margin:0;line-height:1.8">没抽到明显的数字或技术关键词。可以点上面的类型切换，或者直接去题库看生成的题。</p>`:""}
        <p class="tiny muted" style="margin:14px 0 0;line-height:1.75">写进材料的每一个数字和技术名词，都是面试官伸手就能拉的地方。</p>
      </div>
      <div class="card pad">
        <h3 class="h3">材料结构 <em>点一段看原文</em></h3>
        ${d.segs.slice(0,10).map((s,i)=>{
          const t=stripMd((s.turns[0]||{}).s||"");
          return `<div class="hrow" data-seg="${i}" style="grid-template-columns:1fr 56px;padding:9px 4px">
            <span style="min-width:0">${esc(s.title)}<br><span class="tiny muted">${esc(t.slice(0,42))}${t.length>42?"…":""}</span></span>
            <span class="tiny muted" style="text-align:right">${s.turns.length} 行</span>
          </div>`;
        }).join("")}
      </div>
    </div>`;

  $("#view").innerHTML = typeChips + aiCard + statsHtml + middle + `
    ${needPractice.length?`<div class="card pad" style="margin-bottom:18px">
      <h3 class="h3">建议先练这三题 <em>${isDlg?"回答短 / 被追问":"按生成顺序"}</em></h3>
      ${needPractice.map((q,i)=>`
        <div class="hrow" data-detail="${q.id}" style="grid-template-columns:30px 1fr 84px;padding:11px 4px">
          <span class="tiny muted">${i+1}</span>
          <span style="min-width:0">${esc(q.title)}<br><span class="tiny muted">${esc(q.intent)}</span></span>
          <span class="tiny" style="text-align:right;color:${q.ref?(shortOf(q)?"var(--red)":"var(--amber)"):"var(--muted)"}">${q.ref?(q.ref.replace(/\s/g,"").length+" 字"):"待练"}</span>
        </div>`).join("")}
    </div>`:""}

    ${isDlg?`<div class="card pad">
      <h3 class="h3">话题分布 <em>点一段看原文</em></h3>
      ${d.segs.map((s,i)=>{
        const qn=s.turns.filter(t=>t.w==="Q").length;
        return `<div class="hrow" data-seg="${i}" style="grid-template-columns:84px 1fr 70px;padding:11px 4px">
          <span class="tiny muted" style="font-variant-numeric:tabular-nums">${s.tm||"—"}</span>
          <span style="min-width:0">${esc(s.title)}</span>
          <span class="tiny muted" style="text-align:right">${qn?qn+" 问":s.turns.length+" 段"}</span>
        </div>`;
      }).join("")}
    </div>`:""}
  `;
}

function viewVoice(){
  if(!state.doc) return needDoc();
  const segs=state.doc.segs;
  const openCount=Object.values(state.segOpen).filter(Boolean).length;

  $("#view").innerHTML = `
    <div class="row" style="margin-bottom:14px;flex-wrap:wrap">
      <span class="tiny muted">${segs.length} 段 · 共 ${state.questions.length} 个提问</span>
      <span class="grow"></span>
      <button class="btn sm ghost" id="expandAll">${openCount===segs.length?"全部收起":"全部展开"}</button>
    </div>
    ${segs.map((s,i)=>{
      const open=state.segOpen[i];
      const qn=s.turns.filter(t=>t.w==="Q").length;
      return `<div class="card seg ${open?"open":""}" style="margin-bottom:10px">
        <div class="seg-h" data-seg="${i}">
          <span class="tm">${s.tm||"—"}</span>
          <h4>${esc(s.title)}</h4>
          ${qn?`<span class="topic" style="color:#586064;background:#eef0f0">${qn} 问</span>`:""}
          <span class="tiny muted">${s.turns.length} 轮</span>
        </div>
        <div class="seg-b">
          ${s.turns.map(t=>`<div class="turn ${t.w==="Q"?"q":"a"} ${t.w==="Q"?"":""}">
            <span class="who">${t.w==="Q"?"面试官":t.w==="A"?"你":"正文"}</span>
            <span class="txt">${esc(t.s)}</span>
          </div>`).join("")}
        </div>
      </div>`;
    }).join("")}
    <p class="tiny muted" style="margin-top:14px;line-height:1.8">识别结果来自文本结构，不是逐字语音分析。如果某段没对上，检查一下是不是用了别的说话人写法。</p>
  `;

  $("#expandAll").onclick=()=>{
    const all=Object.values(state.segOpen).filter(Boolean).length===segs.length;
    state.segOpen={};
    if(!all) segs.forEach((_,i)=>state.segOpen[i]=true);
    render();
  };
}


/* =========================================================
   视图：题库
   ========================================================= */
function viewBank(){
  if(!state.doc) return needDoc();
  if(!state.questions.length) return noQuestions();
  const f=state.bankFilter;
  const shortOf=q=>!q.ref || q.ref.replace(/\s/g,"").length<20;
  const isDlg=state.doc.type==="dialogue";
  const doneOf=q=>state.records.some(r=>r.qid===q.id);
  const list=state.questions.filter(q=>{
    if(f==="follow") return q.follow;
    if(f==="short") return shortOf(q);
    if(f==="todo") return !doneOf(q);
    if(f==="done") return doneOf(q);
    return true;
  });
  const best={};
  state.records.forEach(r=>{ best[r.qid]=Math.max(best[r.qid]||0,r.score); });
  const cShort=state.questions.filter(shortOf).length;
  const cFollow=state.questions.filter(q=>q.follow).length;

  $("#view").innerHTML = `
    <div class="filters">
      <button class="fchip ${f==="all"?"on":""}" data-filter="all">全部 ${state.questions.length}</button>
      ${isDlg?`<button class="fchip ${f==="follow"?"on":""}" data-filter="follow">被追问 ${cFollow}</button>
      <button class="fchip ${f==="short"?"on":""}" data-filter="short">答得短 ${cShort}</button>`:""}
      <button class="fchip ${f==="todo"?"on":""}" data-filter="todo">没练过</button>
      <button class="fchip ${f==="done"?"on":""}" data-filter="done">练过</button>
    </div>
    ${list.length?`<div class="qgrid">
      ${list.map(q=>`
        <div class="qcard" data-detail="${q.id}">
          <div>
            ${(LEVEL_META[q.level]||LEVEL_META.deep)?`<span class="topic" style="color:${(LEVEL_META[q.level]||LEVEL_META.deep).c};background:${(LEVEL_META[q.level]||LEVEL_META.deep).bg}">${(LEVEL_META[q.level]||LEVEL_META.deep).t}</span>`:""}
            <span class="topic" style="color:#7a8285;background:#f4f5f2;margin-left:4px">${esc(q.intent)}</span>
            ${q.follow?'<span class="topic" style="color:#ad3a30;background:#fbeeec;margin-left:4px">追问</span>':""}
          </div>
          <h4>${esc(q.title)}</h4>
          <div class="meta">
            <span class="tiny muted">${q.points&&q.points.length?q.points.length+" 条要点":(q.ref?(q.ref.replace(/\s/g,"").length+" 字回答"):"待练")}</span>
            <span class="best">${best[q.id]!=null?`最高 <b style="color:${scoreColor(best[q.id])}">${best[q.id]}</b>`:"未练"}</span>
          </div>
        </div>`).join("")}
    </div>`:`<div class="card empty"><b>这个筛选下没有题</b>换一个筛选条件看看。</div>`}
  `;
}

function openDetail(id){
  const q=qById(id);
  if(!q) return;
  const recs=state.records.filter(r=>r.qid===id);
  const best=recs.length?Math.max(...recs.map(r=>r.score)):null;

  const m=document.createElement("div");
  m.className="modal";
  m.innerHTML=`<div class="modal-inner">
    <span class="topic" style="color:#586064;background:#eef0f0">${esc(q.intent)}</span>
    <h2 style="margin-top:10px">${esc(q.title)}</h2>
    <p class="tiny muted" style="margin:0">${recs.length?`练过 ${recs.length} 次 · 最高 ${best} 分`:"还没练过"}</p>

    <div class="kv"><h4>${q.ref?"这场面试里，你当时的回答":(q.src?"原文出处":"出处")}</h4>
      <div class="inner" style="margin-top:0">${q.ref?nl2br(q.ref):(q.src?nl2br(q.src):'<span class="muted">这道题由材料推断生成，原文没有直接对应的段落。</span>')}</div>
    </div>

    ${(q.points&&q.points.length)?`<div class="kv"><h4>答题要点（先自己讲，再对照）</h4>
      <ul>${q.points.map(p=>`<li>${esc(p)}</li>`).join("")}</ul>
    </div>`:""}

    ${q.followups.length?`<div class="kv"><h4>接着被追问</h4>
      <ul>${q.followups.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
    </div>`:""}

    <div class="kv"><h4>怎么用这道题</h4>
      <p>先别看当时的回答，自己开口讲一遍，再看评分。当时答得短、或者被追问的题，优先练。</p>
    </div>

    <div class="actions-row">
      <button class="btn" data-start="${q.id}">练这一题</button>
      <button class="btn ghost" data-close="1">关闭</button>
    </div>
  </div>`;
  document.body.appendChild(m);
  m.addEventListener("click",e=>{
    if(e.target===m||e.target.dataset.close) m.remove();
    const st=e.target.closest("[data-start]");
    if(st){ m.remove(); startPractice([st.dataset.start]); }
  });
}

/* =========================================================
   视图：陪练
   ========================================================= */
function viewPractice(){
  if(!state.doc) return needDoc();
  if(!state.questions.length) return noQuestions();
  if(!state.practice) return practiceSetup();
  const p=state.practice;
  if(p.phase==="answer") return practiceAnswer();
  if(p.phase==="scoring") return practiceScoring();
  if(p.phase==="result") return practiceResult();
  if(p.phase==="summary") return practiceSummary();
}

function practiceSetup(){
  const qs=state.questions;
  const shortOf=q=>!q.ref||q.ref.replace(/\s/g,"").length<20;
  const weak=qs.filter(q=>shortOf(q)||q.follow);
  const unpracticed=qs.filter(q=>!state.records.some(r=>r.qid===q.id));

  $("#view").innerHTML = `
    <div class="setup">
      <div class="card pad">
        <h3 class="h3">选一种练法</h3>
        <div class="modegrid">
          <button class="modebox on" data-mode="one"><b>顺序练</b><span>从还没练过的那题开始，一题一题往下。</span></button>
          <button class="modebox" data-mode="weak"><b>挑弱项</b><span>只练「回答很短」和「被追问」的 ${weak.length} 题。</span></button>
          <button class="modebox" data-mode="mock"><b>整场模拟</b><span>随机 5 题连着答，最后给一张总评。</span></button>
        </div>

        <div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:12px">
          <div class="tiny muted">${state.settings.key?"已接入 "+esc(state.settings.model)+"，由模型评分":"还没接入模型，将使用本地粗评（只看表达，不判断技术对错）"}</div>
          <button class="btn" id="startBtn">开始练习</button>
        </div>
      </div>

      <div class="card pad" style="margin-top:16px">
        <h3 class="h3">当前记录</h3>
        <p class="tiny muted" style="margin:0 0 12px">${esc(state.doc.name)} · ${qs.length} 题 · 已练 ${new Set(state.records.map(r=>r.qid)).size} 题</p>
        <div class="row" style="gap:7px;flex-wrap:wrap">
          <button class="btn sm ghost" data-nav="bank">去题库挑一题</button>
          <button class="btn sm ghost" data-nav="voice">先看原声</button>
        </div>
      </div>
    </div>
  `;

  document.querySelectorAll("[data-mode]").forEach(b=>{
    b.onclick=()=>{
      document.querySelectorAll("[data-mode]").forEach(x=>x.classList.remove("on"));
      b.classList.add("on"); state._mode=b.dataset.mode;
    };
  });
  state._mode="one";

  $("#startBtn").onclick=()=>{
    const mode=state._mode;
    if(mode==="weak"){
      const pool=weak.length?weak:qs;
      startPractice(pool.slice(0,5).map(q=>q.id));
    }else if(mode==="mock"){
      const sh=qs.slice().sort(()=>Math.random()-0.5).slice(0,5);
      startPractice(sh.map(q=>q.id));
    }else{
      const pool=unpracticed.length?unpracticed:qs;
      startPractice([pool[0].id]);
    }
  };
}

function startPractice(qids){
  state.practice={queue:qids,idx:0,phase:"answer",startedAt:Date.now(),qStart:Date.now(),timer:null,elapsed:0,transcript:"",result:null};
  state.view="practice";
  render(); tickTimer();
}

function tickTimer(){
  const p=state.practice;
  if(!p||p.phase!=="answer") return;
  clearInterval(p.timer); p.qStart=Date.now();
  p.timer=setInterval(()=>{
    const el=document.getElementById("timer"); if(!el) return;
    const s=Math.floor((Date.now()-p.qStart)/1000); p.elapsed=s;
    el.textContent=`${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
  },1000);
}

function practiceAnswer(){
  const p=state.practice;
  const q=qById(p.queue[p.idx]);
  const total=p.queue.length;

  $("#view").innerHTML = `
    <div class="qhead">
      <span class="topic" style="color:#586064;background:#eef0f0">${esc(q.intent)}</span>
      ${total>1?`<span class="progress-txt">第 ${p.idx+1} / ${total} 题</span>`:""}
      <span class="tiny muted">建议 60–120 秒讲完</span>
      <span class="timer" id="timer">00:00</span>
    </div>

    <div class="card pad">
      <p class="qbody">${esc(q.title)}</p>
      <p class="qintent">${q.follow?"这是一句追问，先正面回答，再补一句依据。":"先给结论，再分步骤说。"}</p>

      <div class="answer-wrap">
        <textarea id="answer" placeholder="直接开口讲，或者打字。先说结论，再分步骤——别用「就是」开头。">${esc(p.transcript||"")}</textarea>
        <div class="answer-tools">
          <button class="mic" id="micBtn" title="语音输入（Chrome / Edge）">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
          </button>
          <span class="tiny muted" id="micHint"></span>
        </div>
        <span class="counters" id="counters">0 字</span>
      </div>

      <div class="hintline">
        <span>Ctrl / ⌘ + Enter 提交</span>
        <span id="fillerLine"></span>
      </div>

      <div class="actions-row">
        <button class="btn" id="submitBtn">提交评分</button>
        <button class="btn ghost" id="skipBtn">跳过这题</button>
        ${total>1?`<button class="btn ghost" id="quitBtn">结束本场</button>`:""}
      </div>
    </div>

    <div class="card pad" style="margin-top:14px">
      <h3 class="h3">口述结构 <em>卡住时看这四条</em></h3>
      <div class="tips4">
        <div>① 第一句先给答案，再说「分三步」</div>
        <div>② 不说「应该」，知道就肯定说，不确定就直说</div>
        <div>③ 不会的题：这块记不清，思路是…现在让我实现会…</div>
        <div>④ 答完主动补一句「这里我还考虑过…」</div>
      </div>
    </div>
  `;

  const ta=$("#answer");
  const upd=()=>{
    const t=ta.value, n=t.replace(/\s/g,"").length;
    $("#counters").textContent=n+" 字";
    const f=countFillers(t);
    const top=Object.entries(f.map).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]).slice(0,3);
    $("#fillerLine").innerHTML=top.length?`口头禅：${top.map(([w,v])=>`「${w}」×${v}`).join(" ")}`:"";
  };
  ta.addEventListener("input",()=>{ p.transcript=ta.value; upd(); });
  upd(); ta.focus();

  $("#submitBtn").onclick=()=>submitAnswer();
  ta.addEventListener("keydown",e=>{ if((e.metaKey||e.ctrlKey)&&e.key==="Enter"){ e.preventDefault(); submitAnswer(); } });
  $("#skipBtn").onclick=()=>nextQuestion();
  const qb=$("#quitBtn"); if(qb) qb.onclick=()=>endSession();

  setupMic(ta,upd);
  tickTimer();
}

function nextQuestion(){
  const p=state.practice; if(!p) return;
  if(p.idx<p.queue.length-1){
    p.idx++; p.phase="answer"; p.transcript=""; p.result=null;
    render(); tickTimer();
  }else endSession();
}

let recognition=null;
function setupMic(ta,upd){
  const btn=$("#micBtn"), hint=$("#micHint");
  if(!btn) return;
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ btn.style.display="none"; hint.textContent="当前浏览器不支持语音输入"; return; }
  if(recognition){ try{ recognition.abort(); }catch(e){} }

  recognition=new SR();
  recognition.lang="zh-CN";
  recognition.continuous=true;
  recognition.interimResults=true;

  let base="";
  btn.onclick=()=>{
    if(btn.classList.contains("rec")){ recognition.stop(); return; }
    base=ta.value+(ta.value?"\n":"");
    try{ recognition.start(); }catch(e){}
    btn.classList.add("rec"); hint.textContent="正在听…说完点一下停止";
  };
  recognition.onresult=e=>{
    let fin="",mid="";
    for(let i=e.resultIndex;i<e.results.length;i++){
      const r=e.results[i];
      if(r.isFinal) fin+=r[0].transcript; else mid+=r[0].transcript;
    }
    if(fin) base+=fin;
    ta.value=base+mid; upd();
  };
  recognition.onerror=e=>{
    btn.classList.remove("rec");
    hint.textContent=e.error==="not-allowed"?"麦克风被拒绝，请在地址栏允许":"识别中断，再点一次";
  };
  recognition.onend=()=>{
    btn.classList.remove("rec");
    if(hint.textContent.startsWith("正在听")) hint.textContent="已停止";
  };
}

async function submitAnswer(){
  const p=state.practice; if(!p) return;
  const q=qById(p.queue[p.idx]);
  const raw=$("#answer")?$("#answer").value.trim():"";
  if(raw.length<8){ toast("至少说两句再提交"); return; }
  if(recognition){ try{ recognition.stop(); }catch(e){} }
  clearInterval(p.timer);

  p.phase="scoring";
  p.pending={q,answer:raw,seconds:p.elapsed||Math.floor((Date.now()-p.qStart)/1000),chars:raw.replace(/\s/g,"").length,fillers:countFillers(raw).total};
  render();

  const tips=["拆解你的回答…","检查有没有跑题…","看结构是不是先结论后分步…","准备追问…"];
  let ti=0;
  const tipTimer=setInterval(()=>{ const el=document.getElementById("steps"); if(el) el.textContent=tips[ti++%tips.length]; },1400);

  let result;
  try{
    const s=state.settings;
    if(s.base&&s.key&&s.model){
      result=normalizeResult(await callModel(buildScorePrompt(q,raw),{temp:0.2,maxTokens:1400}),q);
    }else{
      await new Promise(r=>setTimeout(r,700));
      result=localScore(q,raw);
    }
  }catch(err){
    clearInterval(tipTimer);
    p.phase="answer"; render();
    const ta=$("#answer"); if(ta){ ta.value=raw; ta.focus(); }
    toast(err.message==="NO_CONFIG"?"还没配置模型":err.message);
    if(/网络|CORS|超时|失败/.test(err.message)){
      setTimeout(()=>{
        if(confirm(err.message+"\n\n要不要先用本地粗评，把这次回答记下来？")) finishScore(q,raw,localScore(q,raw));
      },300);
    }
    return;
  }
  clearInterval(tipTimer);
  finishScore(q,raw,result);
}

function finishScore(q,raw,result){
  const p=state.practice;
  const rec={
    id:"r"+Date.now()+"_"+Math.floor(Math.random()*999),
    qid:q.id,ts:Date.now(),score:result.score,dims:result.dims,
    verdict:result.verdict,hits:result.hits,misses:result.misses,errors:result.errors,
    betterAnswer:result.betterAnswer,followUp:result.followUp,followUpWhy:result.followUpWhy,
    tags:result.tags,answer:raw,seconds:p.pending.seconds,chars:raw.replace(/\s/g,"").length,
    fillers:countFillers(raw).total,local:!!result.local
  };
  state.records.push(rec); save();
  p.result=rec; p.phase="result"; render();
}

function normalizeResult(r,q){
  const clamp=n=>Math.max(0,Math.min(100,Math.round(Number(n)||0)));
  const d=r.dims||{};
  return {
    score:clamp(r.score??avg(Object.values(d).map(Number))),
    dims:{accuracy:clamp(d.accuracy??r.score),completeness:clamp(d.completeness??r.score),structure:clamp(d.structure??r.score),depth:clamp(d.depth??r.score)},
    verdict:r.verdict||"",
    hits:Array.isArray(r.hits)?r.hits.slice(0,6):[],
    misses:Array.isArray(r.misses)?r.misses.slice(0,6):[],
    errors:Array.isArray(r.errors)?r.errors.filter(e=>e&&(e.quote||e.problem||e.fix)).slice(0,4):[],
    betterAnswer:r.betterAnswer||"",
    followUp:r.followUp||(q.followups[0]||""),
    followUpWhy:r.followUpWhy||"",
    tags:Array.isArray(r.tags)?r.tags.slice(0,5):[],
    local:false
  };
}

function download(name,content,type){
  const blob=new Blob([content],{type:type+";charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  toast("已导出 "+name);
}

function copyText(txt){
  if(navigator.clipboard&&window.isSecureContext){

}
function fallbackCopy(txt){
  const ta=document.createElement("textarea");

  try{ document.execCommand("copy"); toast("已复制"); }catch(e){ toast("复制失败，手动选中吧"); }

/* =========================================================
   网络自检：把「网络不通 / 被浏览器拦 / 被 CORS 拒」分开
   ========================================================= */
async function probeHost(url,ms){
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(), ms||8000);
  const t0=Date.now();
  try{
    // no-cors + text/plain：不触发预检，只要网络层能到就一定 resolve
    await fetch(url,{mode:"no-cors",method:"POST",headers:{"Content-Type":"text/plain"},
      body:"{}",signal:ctrl.signal,cache:"no-store"});
    clearTimeout(timer);
    return {ok:true,ms:Date.now()-t0};
  }catch(e){
    clearTimeout(timer);
    return {ok:false,ms:Date.now()-t0,abort:e.name==="AbortError"};
  }
}

async function runProbe(write){
  const base=normalizeBase($("#fBase").value)||"https://api.deepseek.com/v1";
  const ds=base.replace(/\/+$/,"")+"/chat/completions";

  write('<div class="tiny muted">正在检测 · 约 10 秒</div>');

  const env=[];
  if(location.protocol==="file:") env.push("页面是 file:// 直接打开的，部分浏览器会拦跨域请求");
  if(window.self!==window.top) env.push("页面在 iframe / 应用内预览面板里，可能被页面的 CSP 禁止外部请求");
  if(navigator.onLine===false) env.push("浏览器报告当前离线");

  const [a,b]=await Promise.all([
    probeHost(ds),
    probeHost("https://open.bigmodel.cn/api/paas/v4/chat/completions")
  ]);

  const mark=r=>r.ok?'<b style="color:var(--green)">通</b>'
    :(r.abort?'<b style="color:var(--amber)">超时</b>':'<b style="color:var(--red)">不通</b>');

  let verdict, act;

    act="① 关掉广告拦截类扩展；② Edge 里把「跟踪防护」对这个站点设为关闭；③ 用 Chrome 无痕窗口打开线上地址再试；④ 仍不行就点下面的「用本地代理」。";
  }else if(!a.ok&&b.ok){

    act="把服务商换成智谱（glm-4-flash）最省事；一定要用 DeepSeek，就走本地代理。";
  }else if(a.ok&&!b.ok){
    verdict="DeepSeek 能通，智谱不通。问题只在智谱那条链路。";
    act="继续用 DeepSeek 即可。";
  }else{
    verdict="两个接口<b>都连不上</b>，说明不是 CORS，是你本机到外网 API 的链路断了。";
    act="检查代理软件是否开着但规则写错（常见：代理只放行浏览器，不放行 fetch 的直连）、公司网络是否要装证书、DNS 是否能解析。";
  }

  write(`
    <div class="tiny" style="line-height:1.9">
      <div>· 当前接口：${esc(ds)} ${mark(a)} <span class="muted">${a.ms}ms</span></div>
      <div>· 对照接口（智谱）：${mark(b)} <span class="muted">${b.ms}ms</span></div>

    <div class="tiny muted" style="margin-top:6px;line-height:1.8">${act}</div>`);
}

/* =========================================================

function buildScorePrompt(q,answer){
  const ref=q.ref?`【这场面试里你当时的回答（可能本身有错，只作背景，不要当成标准答案）】\n"""\n${q.ref}\n"""\n\n`:"";
  const pts=(q.points&&q.points.length)?`【参考要点】\n${q.points.map((p,i)=>(i+1)+". "+p).join("\n")}\n\n`:"";
  return [
    {role:"system",content:`你是「面试陪练台」的评分官，扮演一位严格但公正的 Java 后端技术面试官。
评估的是候选人的口头回答，可能由语音转写而来，有错别字和口语重复，请忽略转写噪音，只判断技术内容。

评分维度：
- accuracy 技术准确性（权重 40%）
- completeness 要点完整性（权重 30%）
- structure 表达结构（权重 15%）
- depth 深度：有没有讲清为什么这么做、代价是什么（权重 15%）

严格打分：答非所问、空话套话、明显背错低于 30；要点答对一半 55-70；全部命中且有取舍思考 85 以上。不要因为态度好就抬分。
只输出 JSON，不要 markdown 代码块，不要解释。`},
    {role:"user",content:`【题目】${q.title}
${ref}${pts}【这次练习的回答】
"""
${answer}
"""

输出这个 JSON：
{
  "score": 0,
  "dims": {"accuracy":0,"completeness":0,"structure":0,"depth":0},
  "verdict": "一句话结论，30 字内",
  "hits": ["命中的要点，最多 4 条，每条 20 字内"],
  "misses": ["遗漏的关键点，最多 4 条"],
  "errors": [{"quote":"原话片段","problem":"错在哪","fix":"正确说法"}],
  "betterAnswer": "180-260 字的口头示范，第一人称，分点但口语化",
  "followUp": "面试官的下一个问题",
  "followUpWhy": "这个追问想考察什么，20 字内",
  "tags": ["知识点标签，2-4 个"]

async function callModel(messages,opts={}){
  const s=state.settings;
  if(!s.base||!s.key||!s.model) throw new Error("NO_CONFIG");
  const base=normalizeBase(s.base);
  if(!base) throw new Error("Base URL 没填。例：https://api.deepseek.com/v1");
  const url=base+"/chat/completions";
  const body={model:s.model,messages,temperature:opts.temp!=null?opts.temp:0.3,max_tokens:opts.maxTokens||1400,stream:false};
  if(opts.json!==false) body.response_format={type:"json_object"};

  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),90000);
  let res;
  try{
    res=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+s.key},body:JSON.stringify(body),signal:ctrl.signal});
    if(!res.ok&&body.response_format){
      const t=await res.text();
      if(res.status===400||/response_format|json_object/i.test(t)){
        delete body.response_format;
        res=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+s.key},body:JSON.stringify(body),signal:ctrl.signal});
      }else throw new Error(apiErr(t,res.status));
    }
  }catch(e){
    clearTimeout(timer);
    if(e.name==="AbortError") throw new Error("请求超时（90 秒）。换个更快的模型试试。");
    if(e instanceof TypeError){
      throw new Error("网络请求失败：浏览器没拿到响应。\n请求地址："+url+
        "\n\n常见原因：\n· 地址格式不对（必须是 https:// 开头，/v1 结尾，不带 /chat/completions）\n· 浏览器扩展（广告拦截、隐私保护）把请求拦了\n· 该服务商不允许浏览器直连（CORS）\n\n按 F12 打开 Network，点那条红色请求看 Status：blocked 是拦截，failed 是网络或 CORS。");
    }
    throw e;
  }
  clearTimeout(timer);
  if(!res.ok){ const t=await res.text(); throw new Error(apiErr(t,res.status)); }
  const txt=await res.text();
  let data;
  try{ data=JSON.parse(txt); }
  catch(e){
    throw new Error("接口返回的不是 JSON，可能被网关或代理改写。响应前 120 字："+txt.slice(0,120).replace(/\s+/g," "));
  }
  const msg=data?.choices?.[0]?.message||{};
  let content=msg.content;
  if((content==null||content==="")&&msg.reasoning_content) content=msg.reasoning_content;
  content=content==null?"":String(content);
  if(opts.raw) return content;
  return parseJSON(content);
}

function apiErr(text,status){
  let msg="";
  try{ const j=JSON.parse(text); msg=j.error?.message||j.message||""; }catch(e){ msg=text.slice(0,160); }
  if(status===401) return "API Key 无效或已过期（401）。";
  if(status===403) return "没有权限（403）。确认这个 Key 开通了该模型。";
  if(status===404) return "接口地址或模型名不对（404）。地址通常以 /v1 或 /v4 结尾。";
  if(status===429) return "请求太频繁或额度用完了（429）。";
  return `调用失败（${status}）：${msg}`;
}

/* =========================================================
   JSON 解析：容错到「模型输出很脏」也能拿到数据
   ========================================================= */

/* 从任意文本里截出第一个完整的 JSON 结构；截断时返回剩余部分 */
function extractJSON(s){
  const i=s.search(/[{[]/);
  if(i<0) return "";
  const open=s[i], close=open==="{"?"}":"]";
  let depth=0, inStr=false, esc=false;
  for(let k=i;k<s.length;k++){
    const c=s[k];
    if(esc){ esc=false; continue; }
    if(inStr){
      if(c==="\\") esc=true;
      else if(c==='"') inStr=false;
      continue;
    }
    if(c==='"'){ inStr=true; continue; }
    if(c===open) depth++;
    else if(c===close){ depth--; if(depth===0) return s.slice(i,k+1); }
  }
  return s.slice(i);
}

/* 修补常见错误：中文引号、字符串内裸换行、尾逗号、未闭合 */
function repairJSON(src){
  let out="", inStr=false, esc=false;
  for(let i=0;i<src.length;i++){
    const c=src[i];
    if(inStr){
      if(esc){ out+=c; esc=false; continue; }
      if(c==="\\"){ out+=c; esc=true; continue; }
      if(c==='"'){ out+=c; inStr=false; continue; }
      if(c==="\u201d"){
        const rest=src.slice(i+1);
        if(/^\s*[:,}\]}]/.test(rest)){ out+='"'; inStr=false; continue; }
      }
      if(c==="\n"){ out+="\\n"; continue; }
      if(c==="\r"){ out+="\\r"; continue; }
      if(c==="\t"){ out+="\\t"; continue; }
      out+=c; continue;
    }
    if(c==='"'){ inStr=true; out+=c; continue; }
    if(c==="\u201c"){ inStr=true; out+='"'; continue; }   // 中文左引号当结构引号
    out+=c;
  }
  if(inStr) out+='"';
  out=out.replace(/,(\s*[}\]])/g,"$1");

  // 补全括号
  let d1=0,d2=0,inS=false,es=false;
  for(let i=0;i<out.length;i++){
    const c=out[i];
    if(es){ es=false; continue; }
    if(inS){
      if(c==="\\") es=true;
      else if(c==='"') inS=false;
      continue;
    }
    if(c==='"'){ inS=true; continue; }
    if(c==="{") d1++;
    else if(c==="}") d1--;
    else if(c==="[") d2++;
    else if(c==="]") d2--;
  }
  if(d1>0||d2>0) out += "]".repeat(Math.max(0,d2)) + "}".repeat(Math.max(0,d1));
  return out;
}

function parseJSON(text){
  const raw=String(text==null?"":text).replace(/^\uFEFF/,"").trim();
  if(!raw) throw new Error("模型返回了空内容。可能是触发了内容过滤，或者这个模型不支持 JSON 模式。");

  const cands=[];
  const fenced=[...raw.matchAll(/```(?:json|JSON)?\s*([\s\S]*?)```/g)].map(m=>m[1].trim()).filter(Boolean);
  fenced.forEach(f=>cands.push(f));
  cands.push(raw);

  // 一轮：原文或围栏内直接解析
  for(const c of cands){
    const ex=extractJSON(c);
    for(const t of ex?[ex,c]:[c]){
      try{ return JSON.parse(t); }catch(e){}
    }
  }
  // 二轮：修补后再试
  for(const c of cands){
    const ex=extractJSON(c);
    for(const t of ex?[ex,c]:[c]){
      try{ return JSON.parse(repairJSON(t)); }catch(e){}
    }
  }
  const head=raw.slice(0,90).replace(/\s+/g," ");
  throw new Error("模型输出不是合法 JSON（开头："+head+"…）。再点一次通常就好了；反复出现请换 deepseek-chat 这类输出稳定的模型。");
}

/* 输出被截断时，逐个抢救已经完整的题目对象 */
function salvageQuestions(text){
  const s=String(text||"");
  const i=s.indexOf('"questions"');
  if(i<0) return null;
  const b=s.indexOf("[",i);
  if(b<0) return null;
  const items=[];
  let k=b+1;
  while(k<s.length){
    while(k<s.length && s[k]!=="{") k++;
    if(k>=s.length) break;
    let depth=0,inStr=false,esc=false,start=k,closed=-1;
    for(;k<s.length;k++){
      const c=s[k];
      if(esc){ esc=false; continue; }
      if(inStr){
        if(c==="\\") esc=true;
        else if(c==='"') inStr=false;
        continue;
      }
      if(c==='"'){ inStr=true; continue; }
      if(c==="{") depth++;
      else if(c==="}"){ depth--; if(depth===0){ closed=k; break; } }
    }
    if(closed<0) break;
    const chunk=s.slice(start,closed+1);
    let obj=null;
    try{ obj=JSON.parse(chunk); }
    catch(e){ try{ obj=JSON.parse(repairJSON(chunk)); }catch(_){} }
    if(obj&&(obj.q||obj.question)) items.push(obj);
    k=closed+1;
  }
  return items.length?items:null;
}

/* 判断输出是不是被截断（结尾不是闭合括号） */
function truncated(text){
  const t=String(text||"").trim().replace(/```\s*$/,"").trim();
  return t.length>0 && !/[}\]]$/.test(t);
}

function salvageField(text,key){
  const m=String(text||"").match(new RegExp('"'+key+'"\\s*:\\s*"((?:[^"\\\\]|\\\\.)*)"'));
  if(!m) return "";
  try{ return JSON.parse('"'+m[1]+'"'); }catch(e){ return m[1]; }
}

function localScore(q,answer){
  const len=answer.replace(/\s/g,"").length;
  const f=countFillers(answer).total;
  const struct=/(第一|首先|分[一二三四五]|先说|其次|最后|一是|二是)/.test(answer);
  const why=/(因为|所以|为了|代价|取舍|如果|否则|风险|好处|缺点)/.test(answer);
  const clamp=n=>Math.max(0,Math.min(100,Math.round(n)));
  const accuracy=clamp(52+(len>80?12:0)+(len>180?8:0)+(why?12:0)-Math.min(18,f*2));
  const completeness=clamp(25+Math.min(55,len/4)+(struct?12:0));
  const structure=clamp(45+(struct?28:0)+(len>140?10:0)-Math.min(20,f*3));
  const depth=clamp(42+(why?26:0)+(len>200?12:0));
  const score=clamp(accuracy*.4+completeness*.3+structure*.15+depth*.15);
  return {
    score,local:true,
    dims:{accuracy,completeness,structure,depth},
    verdict:len<30?"太短了，先把结论和两三个理由说满。":struct?"结构清楚，再补一点取舍和代价。":"先给结论，再用「第一、第二」展开。",
    hits:[],misses:[],errors:[],betterAnswer:"",
    followUp:(q.followups&&q.followups[0])||"",
    followUpWhy:"来自这段面试里的真实追问",
    tags:["本地粗评"]
  };
}

/* =========================================================
   事件
   ========================================================= */
document.addEventListener("click",e=>{
  const nav=e.target.closest("[data-nav]");
  if(nav){
    if(state.practice&&state.practice.timer) clearInterval(state.practice.timer);
    state.practice=null; state.view=nav.dataset.nav; render(); return;
  }
  const gen=e.target.closest("[data-gen]");
  if(gen){ generateWithAI(); return; }
  if(e.target.id==="expq"){ exportQuestions(); return; }

  const f=e.target.closest("[data-filter]");
  if(f){ state.bankFilter=f.dataset.filter; render(); return; }

  const ty=e.target.closest("[data-type]");
  if(ty&&state.doc){
    const doc=state.doc;
    if(doc.type===ty.dataset.type) return;
    doc.type=ty.dataset.type;
    state.questions=[];
    state.ai={status:"idle",error:"",summary:"",advice:[]};
    state.practice=null;
    LS.set("doc",{name:doc.name,raw:doc.raw,type:doc.type,at:doc.at});
    LS.set("ai",null);
    toast("已切换为「"+TYPE_NAMES[doc.type]+"」");
    if(aiReady()){ generateWithAI(); return; }
    render(); return;
  }

  const sg=e.target.closest("[data-seg]");
  if(sg){
    const k=sg.dataset.seg;
    if(sg.classList.contains("seg-h")){
      state.segOpen[k]=!state.segOpen[k];
      sg.parentElement.classList.toggle("open");
      return;
    }
    state.segOpen[k]=true; state.view="voice"; render();
    setTimeout(()=>{ const el=document.querySelectorAll(".seg")[k]; if(el) el.classList.add("open"); },30);
    return;
  }

  const det=e.target.closest("[data-detail]");
  if(det){ openDetail(det.dataset.detail); return; }

  const open=e.target.closest("[data-open]");
  if(open){ openRecord(open.dataset.open); return; }
});

document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){ const m=document.querySelector(".modal"); if(m) m.remove(); }
});

/* =========================================================
   启动
   ========================================================= */
(function boot(){
  const saved=LS.get("doc",null);
  if(saved&&saved.raw){
    const d=parseMarkdown(saved.raw,saved.name);
    if(d.segs.length){
      d.type=saved.type||detectType(d,saved.name);
      d.facts=docFacts(d);
      state.doc=d;
      state.questions=[];
      const ok=restoreAI();
      d.stats=buildStats(d,state.questions);
      state.view="overview";
    }
  }
  updateApiStatus();
  render();
})();

</script>
</body>
</html>
